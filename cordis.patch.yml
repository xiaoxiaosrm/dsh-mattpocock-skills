# @mattpocock-community/dsh-engineering-skills — DSH bundle layer
#
# Brings Matt Pocock's agent skills (originally distributed as a Claude Code
# plugin by mattpocock/skills) into DeepSeek Harness as native discoverable
# skills. v0.5.2 ships the 9 skills enabled in `enabled-skills.json`
# (grill-with-docs, research, and the seven productivity skills).
#
# The bundle registers its own host `skill-filesystem` instance in the global
# skill layer, so the set loads in EVERY DSH surface (web, TUI, headless).
#
# Why not patch the shared host `skill-filesystem` row: the Web profile ships
# that row `disabled` ("presets own local discovery"), so appending
# `customSkillDirs` to it made the whole set invisible on the web surface.
# A distinct `providerName` also avoids colliding with a preset's default
# `filesystem` provider, and `includeDefaultRoots: false` keeps this instance
# scanning ONLY this bundle's own `skills/` directory.
#
# Verified against DSH 0.2.2-rc.1 (desktop and web runtimes):
#
# - Bundle patches are still merged by `dsh-app-boot` `mountRootInclude`,
#   which passes the PROFILE directory as the patch `baseUrl`
#   (`pathToFileURL(dirname(absoluteConfigPath))`). The `!!js` scalar below
#   therefore resolves to
#   `<profile>/node_modules/@mattpocock-community/dsh-engineering-skills/skills/`
#   after `dsh plugin add` (or the desktop Plugins installer) installs this
#   package into the profile.
# - The package pins `@deepseek-ai/dsh-skill-filesystem` to 0.2.2-rc.1 on
#   purpose. The npm `latest` dist-tag for that package is still 0.0.1-rc.3
#   (`next` is 0.2.2-rc.1), so a `*` range resolves to the pre-0.2 module,
#   whose peer requirements do not match a 0.2.2 runtime and whose row would
#   be denied at boot. Bump the pin together with the DSH runtime: 0.2.2-rc.1
#   requires exact `@deepseek-ai/dsh-fs`, `dsh-home-paths`, and `dsh-skill` at
#   0.2.2-rc.1, plus `@deepseek-ai/cordis ~4.1.0` (the version the 0.2.2
#   runtime ships).
# - If the package is ever relocated outside a profile's `node_modules`
#   (manual move, non-pnpm layout, vendored copy), this expression must be
#   adjusted to the actual location.

- insert:
    - id: skill-filesystem-mattpocock
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: mattpocock
        includeDefaultRoots: false
        customSkillDirs:
          - !!js process.getBuiltinModule('node:url').fileURLToPath(new URL('node_modules/@mattpocock-community/dsh-engineering-skills/skills/', baseUrl))
